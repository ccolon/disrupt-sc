    why: 'convention: TEN-T is the network name; the number word ''ten'' is a false positive'

claims:
  - file: sections/si.tex
    text: 'nine per region--sector on average'
    expr: 'NFirms/(NRegions*NSectors)'
    range: [8.5, 9.5]
    why: 'result: firm agents per region-sector, 12,719 over 28 x 50 = 9.1 (a little more over the non-empty region-sectors); nine = 8.5-9.5'
  - file: sections/si.tex
    text: 'The 39 other sectors are placed on NUTS3 employment'
    expr: 'NSectors - 11'
    range: [39, 39]
    why: 'data bound to the macro: \NSectors less the eleven facility sectors'
  - file: sections/si.tex
    text: 'survey of ref.~\citep{pichler2022} mapped to the 50 sectors'
    expr: 'NSectors'
    range: [50, 50]
    why: 'data bound to the macro: the literal 50 is \NSectors (or write \NSectors{} in the text)'
  - file: sections/si.tex
    text: 'sea lanes (948) and multimodal connectors at terminals and ports (1,490)'
    expr: 'NEdges - 2979 - 4261 - 461 - 948'
    range: [1490, 1490]
    why: 'data bound to the macro: the five edge counts of the TEN-T extraction sum to \NEdges'

