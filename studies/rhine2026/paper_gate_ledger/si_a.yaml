claims:
  - file: si.tex
    text: 'nine per region--sector on average'
    expr: 'NFirms/(NRegions*NSectors)'
    range: [8.5, 9.5]
    why: 'result: firm agents per region-sector, 12,719 over 28 x 50 = 9.1 (a little more over the non-empty region-sectors); nine = 8.5-9.5'
  - file: si.tex
    text: 'sea lanes (948) and multimodal connectors at terminals and ports (1,490)'
    expr: 'NEdges - 2979 - 4261 - 461 - 948'
    range: [1490, 1490]
    why: 'data bound to the macro: the five edge counts of the TEN-T extraction sum to \NEdges'

  # 5 Nov 2026 pending fix (patch_pending_20261105.py); words bound to the new macros
  - file: si.tex
    text: 'with the waterway share of liquids nearly a third too high'
    expr: '100*(CargoLiquidIww/30-1)'
    range: [27, 33]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: the liquid-bulk waterway share 39 against 30 % (unrounded 39.1 against 30.2: +29 %); nearly a third = 27-33'
  - file: si.tex
    text: 'within 10\,\% at Hamburg'
    expr: 'max(abs(PortHamburgMt/99.6-1), abs(PortHavreMt/75.56-1), abs(PortMarseilleMt/67.26-1), abs(PortGenoaMt/46.6-1), abs(PortGothenburgMt/34.98-1), abs(PortBilbaoMt/31.53-1))*100'
    range: [0, 10]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: largest gap of the six to Eurostat 2023 (unrounded: Marseille +7.8 %)'
  - file: si.tex
    text: 'within a quarter at Dublin'
    expr: 'max(abs(PortDublinMt/24.67-1), abs(PortNantesMt/28.48-1), abs(PortDunkirkMt/35.39-1), abs(PortBremerhavenMt/39.19-1))*100'
    range: [10, 25]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: Dublin +11, Nantes -13, Dunkirk -19, Bremerhaven -24 % (unrounded); within a quarter = up to 25'
  - file: si.tex
    text: 'a third below at Antwerp-Bruges'
    expr: 'max(abs(100*(1-PortAntwerpMt/242.24)-100/3), abs(100*(1-PortAmsterdamMt/80.76)-100/3))'
    range: [0, 3.7]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: Antwerp-Bruges and Amsterdam 33 % below; a third = 30-37'
  - file: si.tex
    text: 'about two fifths below at Barcelona'
    expr: 'max(abs(100*(1-PortBarcelonaMt/51.46)-40), abs(100*(1-PortGhentMt/29.95)-40), abs(100*(1-PortValenciaMt/62.25)-40))'
    range: [0, 5]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: Barcelona 36, Ghent 39, Valencia 41 % below (unrounded); about two fifths = 35-45'
  - file: si.tex
    text: 'and its waterways half'
    expr: '100*NLWaterTkmBn/41.6'
    range: [45, 55]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: Dutch waterway tkm 21.5 against 41.6 bn = 52 %; half = 45-55'
  - file: si.tex
    text: 'the Mannheim--Mainz reach is above them'
    expr: 'RhineMannheimMainzMt/40'
    range: [1.0, 2.0]
    why: '5 Nov 2026 pending fix (patch_pending_20261105.py); result: Mannheim-Mainz 46 against 40 (+16 %)'
