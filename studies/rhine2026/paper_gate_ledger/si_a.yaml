  - file: sections/si.tex
    text: 'the 27 member states of the European Union and Switzerland'
    why: 'data: the ICIO scope (EU27 + CH = \NRegions)'
  - file: sections/si.tex
    text: 'an aggregation of ISIC revision 4 at the two-digit level'
    why: 'convention: the classification of the ICIO sectors'
  - file: sections/si.tex
    text: 'the rest of the world is grouped into twelve external partners'
    why: 'data: the rest-of-world grouping of the model, the twelve listed in the sentence'
  # ---------------------------------------------------------------- S1 Agents
