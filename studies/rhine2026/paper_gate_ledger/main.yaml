  # ---------------------------------------------------------------- abstract and introduction
  # ---------------------------------------------------------------- results
  - file: main.tex
    text: 'when the river still passes two to four fifths of its normal tonnage'
    expr: 'KaubPassJul'
    range: [40, 80]
    why: 'data-derived macro: July mean share of normal tonnage past Kaub, loading table on the 2026 profile (weekly 30-80 % in weeks 1-6); two to four fifths = 40-80'
  - file: main.tex
    text: 'billion avoided, more than half the effect'
    expr: '100*StockTAvoidedBn/StockAvoidedBn'
    range: [50, 75]
    why: 'result: loss avoided by the targeted week over the general week; more than half = 50-75'
  # ---------------------------------------------------------------- discussion
  - file: main.tex
    text: 'The model''s cumulated loss lies within its 95\,\% band but below its center'
    expr: '(ModelIntEnsMean - RecordIntLowW)/(RecordInt - RecordIntLowW)'
    range: [0, 0.99]
    why: 'result: position of the model''s 2018 industrial integral (mean of the networks) between the 2.5th percentile and the center of the benchmark; 95 % = convention'
  - file: main.tex
    text: 'industry carries more than a third of it'
    expr: 'IndustryShare'
    range: [33.4, 50]
    why: 'result: % of the German gross loss in industry (B-E); more than a third = 33.4-50'
  - file: main.tex
    text: 'shipping companies, over half'
    expr: 'ShareRefining+ShareLandTransport+ShareLogistics+SharePower+ShareShipping'
    range: [50, 75]
    why: 'result: fuel chain = refining + land transport + logistics + power + water transport, % of the German gross loss; over half = 50-75'
