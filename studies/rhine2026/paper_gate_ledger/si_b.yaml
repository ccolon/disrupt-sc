    text: 'raw 15-minute values, daily means in legal time'
    why: 'data: resolution of the PEGELONLINE gauge record (pegelonline2026) behind scenarios/2026.csv'
  - file: sections/si.tex
    text: 'The 2026 profile has two vintages'
    why: 'data: the two versions of the 2026 profile (scenarios/2026_vintage0910.csv, scenarios/2026.csv of 30 Sep)'
  - file: sections/si.tex
    text: 'the six-week outlook of 7 September'
    why: 'data: horizon of the BfG outlook (bfg2026; scenarios/bfg_6week_kaub_20260907.csv)'
  - file: sections/si.tex
    text: 'The outlook of 7 September put the weeks of 14, 21 and 28 September at 12, 22 and 42\,cm'
    why: 'data: BfG outlook of 7 Sep, ENS medians of the weeks of 14/21/28 Sep (scenarios/2026_vintage0910.csv, bfg_6week_kaub_20260907.csv); 14 and 21 are dates the gate does not read as such'
  - file: sections/si.tex
    text: 'the observed means were 25, 7 and about $-2$ (the last from two observed days and the outlook of 28 September)'
    why: 'data: 2026 profile of 30 Sep (scenarios/2026.csv): weeks of 14/21/28 Sep at 25.2, 6.6 and -1.7 cm (two observed days, 2 and 2 cm, plus the outlook of 28 Sep)'
  - file: sections/si.tex
    text: 'Two stress profiles take the outlook''s 25th and 75th percentile for the forecast weeks'
    why: 'data: the 25-75 % quantiles of the BfG outlook of 28 Sep (scenarios/2026_q25.csv, 2026_q75.csv)'
  - file: sections/si.tex
    text: 'are run as two stress paths of the forecast'
    why: 'design: the two quantile profiles q25 and q75'
