    why: 'result (benchmark path): December over November of the benchmark; a third = 30-37'
  - file: si.tex
    text: 'at higher ones, where the benchmark keeps a third'
    expr: '100*RecDec/RecNov'
    range: [30, 37]
    why: 'result (benchmark path): December over November of the benchmark; a third = 30-37'
