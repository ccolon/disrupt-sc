claims:
  - file: sections/si.tex
    text: 'where the benchmark keeps a third, because the closures of November'
    expr: '100*RecDec/RecNov'
    range: [30, 37]
    why: 'result (benchmark path): December over November of the benchmark; a third = 30-37'
  - file: sections/si.tex
    text: 'at higher ones, where the benchmark keeps a third'
    expr: '100*RecDec/RecNov'
    range: [30, 37]
    why: 'result (benchmark path): December over November of the benchmark; a third = 30-37'
  - file: sections/si.tex
    text: 'from which the shortfall has fallen back by two thirds in December'
    expr: '100*(1 - RecDec/RecNov)'
    range: [63, 70]
    why: 'result (benchmark path): fall from November to December; two thirds = 63-70'
  - file: sections/si.tex
    text: 'where the benchmark has nearly a fifth of its loss in each month'
    expr: '100*RecAug/RecordInt'
    range: [17.6, 20]
    why: 'result (benchmark path): August share of the integral; nearly a fifth = 17.6-20 (September in the next entry)'
  - file: sections/si.tex
    text: 'nothing in August and September, where the benchmark has nearly a fifth'
    expr: '100*RecSep/RecordInt'
    range: [17.6, 20]
    why: 'result (benchmark path): September share of the integral; nearly a fifth = 17.6-20'
  - file: sections/si.tex
    text: 'the rerun on common inputs changes the sums by less than a fifth'
    expr: '100*max(abs(1 - PricedInt/4.11), abs(1 - PricedIntB/2.48), abs(1 - PricedIntC/1.39))'
    range: [0, 20]
    why: 'result: the priced-river rerun against the first version''s sums 4.11 / 2.48 / 1.39 (review of 3 Nov, constants); less than a fifth = below 20'
  - file: sections/si.tex
    text: 'for the rest. It removes a fifth'
    expr: 'RevRailFiftyAbs'
    range: [17, 23]
    why: 'result: 2026 loss removed by the 50 kt ceiling; a fifth = 17-23'
  - file: sections/si.tex
    text: 'and a half of the 2026 loss and a'
    expr: 'RevRailHundredFortyAbs'
    range: [45, 55]
    why: 'result: 2026 loss removed by the 140 kt ceiling; a half = 45-55'
  - file: sections/si.tex
    text: 'the 2026 loss and a quarter and'
    expr: 'RevRailFiftyyyAbs'
    range: [22, 28]
    why: 'result: 2018 loss removed by the 50 kt ceiling; a quarter = 22-28'
  - file: sections/si.tex
    text: 'three fifths of the 2018 loss'
    expr: 'RevRailHundredFortyyyAbs'
    range: [56, 64]
    why: 'result: 2018 loss removed by the 140 kt ceiling; three fifths = 56-64'
  - file: sections/si.tex
    text: 'the restrictive end of a range whose other end halves the loss'
    expr: 'RevRailHundredFortyAbs'
    range: [45, 55]
    why: 'result: 2026 loss removed by the 140 kt ceiling (2018: \RevRailHundredFortyyyAbs); halves = 45-55'

