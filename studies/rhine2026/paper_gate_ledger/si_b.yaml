# Ledger of paper_gate.py for sections/si.tex, lines 51-143 (S3 Scenario construction to S10 Implementation
# conventions), 5 Nov 2026. Format: see the docstring of paper_gate.py. The other parts of si.tex are in si_a.yaml.
allowed:
