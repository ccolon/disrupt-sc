# logistics.basic_cost.waterways, round 2 (25 Oct 2026): the waterway rate by waterway, keyed on the `waterway` tag of the
# tagged network (EU/Transport/tagged/, tag_network_attributes.py). Round 1b showed the canals, the Elbe and the Danube carrying
# three to ten times their Destatis tonnage at the Rhine's rate (Mittellandkanal 37-53 Mt against 12, Dortmund-Ems 29-42
# against 15, Elbe 43-57 against 5, Neckar 10-15 against 4), while the Rhine itself sits within the counts. The rates follow
# the waterway class: the Rhine and the large Dutch and Belgian waterways at the push-convoy rate; the locked tributaries
# (Main, Moselle, Neckar, Saar) and the Danube a third dearer; the canals (class IV/Vb vessels) twice the Rhine rate; the
# Elbe three times (an unreliable, shallow river in reality); the Scheldt-Rhine link and the Amsterdam-Rhine canal at the
# Rhine rate (sea-port approaches). Liquid bulk and containers scale with the same factors.
