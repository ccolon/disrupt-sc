# Cambodia compound-flood paper (Nobile & Colon; Economic Modelling special issue, 30 Nov 2026):
# base configuration of every run, layered on config/default.yaml ONLY.
#
# run_cambodia.py loads default.yaml + this file and ignores config/user_defined_Cambodia*.yaml: the paper's
# runs must not depend on a machine's gitignored local file (the local one, rebuilt 9 Jul 2026 from the legacy
# config, spells Tonle Sap double-encoded - KI-52 - and is not on the cluster). The scenario (disruptions),
# seed, horizon and the per-run switches are set by run_cambodia.py.
#
# Ported 5 Nov 2026 from the July 2025 cluster config (disrupt-sc_cambodia_v2/config/user_defined_Cambodia.yaml,
# the paper's runs of Aug-Dec 2025) and the v2 local config. What changed with the port, and why:
#   - io_cutoff 0.02 + 100 kUSD firm/household cutoffs -> flow_coverage (the v2 filter; no direct translation).
#     0.5 is the v2 local config's value: 20,860 firms after cleanup (seed 1) against 10,623 in the old runs.
#     Decision Q11 (pipeline folder): 0.5 as base, 0.7 as a robustness row, unless the user decides otherwise.
#   - capacity_constraint "gradual" (cost rising with load, retired 21 Sep 2026) -> the on-off capacity gate on
#     the four named edges below (ports of Sihanoukville by rail, Phnom Penh city and main river ports, Bavet
#     border crossing). Whether their baseline loads fit the capacities is checked at build time
#     (baseline_capacity_check.csv).
#   - inventory_restoration_time: the old code's default was 4 days, v2's is 30 (Q13: 30 as base, 4 in
#     robustness).
#   - use_route_cache true (the default; 6 Nov 2026): with the cache off a flood run takes hours (every rerouted
#     link searches a path every day). Cached detours are cleared at every closure change and in the reset since
#     the KI-50 fix (merged 6 Nov 2026, Q12), so the study's successive and overlapping closures never reuse a
#     detour found under another set of closed roads.
#   - removed keys (ignored by v2): monetary_units_inputed, logistics.nb_cost_profiles, basic_cost_random,
#     border_crossing_fees.pipelines, simulation_name, time_lag, the roads_edges filepath (v2 loads
#     Transport/transport.gpkg).

transport_modes: [roads, maritime, waterways, railways]
# USD in the model (6 Nov 2026): the model's value thresholds are EPSILON = 1e-6 model units (Firm.produce skips
# a production target below it, the deliveries below it were skipped before KI-53). In mUSD at daily resolution
# that is 1 USD a day, and the v2 Cambodia economy holds 553 firms below it (9,994 firms, 1.2 % of output, below
# the 2025 config's 100 kUSD-a-year cutoff, which v2 no longer has): their clients never got those inputs and
# strict Leontief stopped them when the stocks ran out (undisturbed run: production -36 % by day 33). In USD the
# thresholds are a micro-dollar a day, below every firm. With the KI-53 fix, an undisturbed 40-day run has zero
# household loss every day; without it, the sub-gram shipments still vanish.
monetary_units_in_model: USD
monetary_units_in_data: mUSD
time_resolution: day

flow_coverage: 0.5

inventory_duration_targets:
  definition: per_input_type
  values:
    utility: 3
    agriculture: 15
    manufacturing: 30
    service: 90
    trade: 30
    construction: 30
    transport: 3
    default: 30
  unit: day
inventory_restoration_time: 30

# Route costs calibrated 7 Nov 2026 (Q17; studies/cambodia/route_calibration.py, report
# Paper_Cambodia/pipeline/reports/05_flow_validation.md). Money and time per route from the JICA 2016 brochure
# "Logistics situation and challenges in Cambodia" (pp. 4-7, 11; 2015 charges per 20-ft container, converted at
# 10 t per container, the conversion behind the network's barge capacities):
#   Phnom Penh - Sihanoukville truck 220 km, 5 h, forwarding $230 + transport $200; rail 250 km, 11 h, $230 + $200;
#   Phnom Penh - Cai Mep barge 340 km, 40 h, $330 + $250, plus the local leg to the river port $230 + $150;
#   Phnom Penh - Bavet - Ho Chi Minh City road: forwarding $640-690 + $250, transport $300 + $200;
#   Phnom Penh - Poipet - Bangkok road: forwarding $640-690 + $200, transport $600 + $700;
#   LO/LO charges (chart reading, p. 11): Sihanoukville ~$70 import / ~$24 export, Phnom Penh port ~$47.
# One parameter is fitted, not observed: the container surcharge at Sihanoukville (44 USD/t on top of its LO/LO),
# the unobserved disadvantage of a feeder port against Cai Mep's direct deep-sea services. With it, the container
# split among Sihanoukville, Mekong barge and Bavet is 59.3 / 22.5 / 18.3 % (2015: 59.3 / 21.4 / 19.3 % of laden
# TEU) on seeds 1-3 alike. Steep: 43.5 gives 63 / 3 / 15 (with Poipet), 44.8 gives 37 / 28 / 15.
# The previous values (ported from the 2025 config) are in git history: roads 0.073, railways 0.025, waterways 0.01
# USD/tkm; loading fees 5-7 USD/t; border 8-10 h and 5 USD/t on every mode.
logistics:
  basic_cost:  # USD per ton-km
    roads: 0.087       # $200 / 230 km / 10 t
    railways: 0.074    # $200 / 270 km / 10 t
    waterways: 0.0735  # $250 / 340 km / 10 t
  speeds:  # km/hour
    roads: 50
    railways: 20
    waterways: 10      # 375 km Phnom Penh - Cai Mep in ~38 h (brochure: 40 h with the border)
  dwell_times:  # hours (port time at the three sea gateways alike; brochure route times exclude it)
    roads-railways: 5
    roads-maritime: 12
    roads-waterways: 2.5      # local leg to the river port: 2.5-3 h
    railways-maritime: 12
    waterways-maritime: 12
  loading_fees:  # USD/ton
    roads-railways: 6
    roads-maritime: 23        # forwarding $230
    roads-waterways: 36       # local leg $230 + $150, less its road line-haul
    railways-maritime: 17     # with roads-railways: forwarding $230
    waterways-maritime: 28    # barge forwarding $330, less the Mekong border fee
    by_port:                  # port extras on the connectors' port_name (studies/cambodia/sea_gateways.py)
      Sihanoukville: {container: 48.7, default: 4.7}   # LO/LO ~4.7 + fitted container surcharge 44
      PhnomPenh: 4.7                                   # LO/LO
  border_crossing_times:  # hours
    roads: 12        # 1-2 h at the border plus queues (Bavet route 52.8 h door to door incl. 16 h at Cat Lai)
    railways: 8
    maritime: 0      # customs at the sea gateways is in their forwarding fees
    waterways: 2.5   # 40 h barge trip less 37.5 h sailing
    multimodal: 10
  border_crossing_fees:  # USD/ton
    roads: 68.5      # cross-border forwarding: $640-690 + $250 on the Vietnam side, less the domestic $230
    maritime: 0
    railways: 5
    waterways: 5
  name-specific:  # USD/ton on the named edge: cross-border trucking above the road line-haul
    bavet_border_crossing: 26.2     # $300 + $200 for ~274 km against 0.087 USD/tkm
    poipet_border_crossing: 91.6    # $600 + $700 + forwarding $200 on the Thai side, for ~648 km

countries_to_include: ['AFR', 'AME', 'ASI', 'EUR', 'OCE', 'THA', 'VNM']
# Overseas partners at sea (7 Nov 2026, Q17: the user chose "at sea"): with `any`, a bloc attaches to the nearest node of
# any mode, and studies/cambodia/sea_gateways.py places AFR, AME, ASI, EUR, OCE on the end node of their sea lane, so
# that routing chooses the port of entry (Sihanoukville, or Cai Mep / Ho Chi Minh City by Mekong barge or by road via
# Bavet). THA and LAO stay land partners (Bangkok, Vientiane), VNM sits on the Ho Chi Minh City road node. With `roads`
# (the default) the blocs entered by road at Bangkok, Vientiane and Ho Chi Minh City and Sihanoukville carried nothing.
country_attachment: any

capacity_constraint: true
transport_capacity_overrides:  # tons per day, by edge name (all four exist in Transport/transport.gpkg)
  pp_sihanoukville: 1000
  pp_city_port: 4500
  pp_main_port: 15000
  bavet_border_crossing: 9000
  # Mekong barge fleet (brochure p. 6: 832 calls, 82,004 TEU a year each way; x 2 x 10 t / 365), on the border edge
  # that every barge crosses (7 Nov 2026; pp_city_port's 4500 is the same number, but barges loading at the main
  # port do not cross that edge). Baseline load ~920 t/day (20 %).
  mekong_border: 4493

use_route_cache: true

simulation_type: disruption
mc_repetitions: 0
epsilon_stop_condition: false
export_files: true
export_link_data: false
export_inventory_data: false
