# ============================================================================
# Gulf scope - Strait of Hormuz (Hormuz 2026 paper, disrupt-sc-studies/hormuz)
# Ported to the v2 engine on 18 Nov 2026 (paper pipeline, node A1) from the
# gitignored April 2026 file (kept on the laptop, byte-identical, as
# config/user_defined_Gulf.april2026.local.yaml, sha256
# 4601c50463e78c319003f5bdbc77546edf35bf12f33cdfe7b26d8e73b859f76d).
# Until this file existed the scope had no committed configuration (material
# audit of 17 Nov 2026, D3; KI-62).
#
# MRIO: GLORIA 2023, 15 regions x 19 sectors, CLOSED (no rest-of-world import
#   rows, no export column): ARE SAU IRQ IRN OMN BHR KWT QAT CHN IND PAK TUR
#   AFR EAS RoW. Every region is a firm/household region, 0 country agents.
#   The extraction is not reproducible (KI-05); the re-extraction is node A21.
# Transport: roads, maritime, airways, pipelines + 113 unnamed multimodal
#   connectors. Named: the "Strait of Hormuz" sea edge, 29 port_* sea lanes,
#   6 border crossings (of 20 border road edges), the pipelines (Petroline,
#   Habshan-Fujairah, Kirkuk-Ceyhan, ...). Two lanes have no land connector
#   (port_salalah, port_khor_al_zubair: no cargo can use them).
#   Which port lane lies on which side of the Strait edge:
#   disrupt-sc-studies/hormuz/data/gulf_port/topology.csv.
# Data used as it is (disrupt-sc-data/Gulf; transport.gpkg carries the
#   uncommitted 24 Apr 2026 edit). sha256 on 18 Nov 2026:
#   Transport/transport.gpkg   06b823451cf1e9ac01f184ddc78a577cfbab7c23b7bf8ae89516e86585e45128
#   Transport/multimodal.gpkg  5d97797631dbbca152d7746aab55a03a2c66b7c43b2b03207cfaeb2d917fec4b
#
# Changes from the April file (each one moves results; material.md section 6):
# - io_cutoff / cutoff_* -> flow_coverage 0.95 (keeps 72-92 % of every Gulf
#   energy and fertiliser export flow vs 0-37 % under io_cutoff 0.8, D7);
# - seed fixed (the April runs were unseeded, KI-34);
# - capacity_constraint "gradual" (retired 21 Sep 2026, 2e03f3c) -> the on-off
#   gate; default_transport_capacity -> cargo_mode_eligibility;
#   logistics.initial_route_assignment "edge_lp" and logistics.chunk_size
#   (retired with the capacity-aware assignment) and route_optimization_weight
#   (inert in v2) deleted;
# - production: strict Leontief (April; the April code had no PBL) -> partially-
#   binding Leontief with the IHS survey matrix (node A2, filepaths.input_criticality);
# - cargo classes: crude (Oil), lng (Gas), Refining as liquid bulk (below);
# - the April capacities are NOT active (see transport_capacity_overrides).
# ============================================================================

filepaths:
  mrio: "Economic/mrio_full.csv"
  sector_table: "Economic/sector_table_full.csv"
  # firms.geojson: 35 oil and gas fields (Oil/Gas columns); the firms of every
  # other region_sector sit at the centroid of their region's household points
  firms_spatial: "Spatial/firms.geojson"
  households_spatial: "Spatial/households.geojson"
  countries_spatial: "Spatial/countries.geojson"
  transport: "Transport/transport.gpkg"
  multimodal: "Transport/multimodal.gpkg"
  # Production rule (node A2, 18 Nov 2026): partially-binding Leontief with the IHS
  # Markit survey criticality (Pichler et al. 2022, Zenodo 10.5281/zenodo.5881855,
  # CC BY 4.0), 54 WIOD industries mapped to the 19 GLORIA sectors by
  # studies/hormuz2026/build_criticality_gulf.py (crosswalk committed next to it in
  # additional_data/). The mapping is many-to-one; this default is the OUTPUT-WEIGHTED
  # rule (mean rating of the WIOD sub-pairs, weights = WIOD 2014 world output,
  # rounded to the nearest class): 18 % of the firms' input value critical, 58 %
  # important, 24 % non-critical (seed 0-9 builds; link_shares_gulf.py). The MAX rule
  # (one critical sub-pair makes the cell critical) makes 92 % critical - by value
  # nearly strict Leontief - and is the conservative alternative. Other rules by
  # overlay, DISRUPT_SC_EXTRA_CONFIG=studies/hormuz2026/rules/<rule>.yaml:
  # pbl_max, strict, thr002 (2 % cost-share proxy, no matrix), pbl_outw_thr002 and
  # pbl_max_thr002 (the matrix among inputs >= 2 % of the input bill). A2 runs:
  # output/Gulf/A2_pbl_20261118 (+ _pit2): the Strait closure binds nothing on this
  # uncapacitated network (0 loss under every rule); with price_increase_threshold 2
  # the matrix alone cascades from immaterial blocked inputs (not settled), the 2 %
  # floor does not. Decided 18 Nov 2026 (Hormuz Q30, the user): output-weighted matrix
  # plus the 2 % floor (critical_input_threshold below), the rule of the Rhine paper.
  # The file lives in disrupt-sc-data and is not a cache key. If it is missing the
  # run falls back to strict Leontief WITHOUT a warning (run.py _configure_firms):
  # check for the exp.log line "Loaded input criticality: ... (37/26/36%)".
  input_criticality: "Economic/input_criticality_ihs_outw.csv"

transport_modes: [roads, maritime, airways, pipelines]
with_transport: True

monetary_units_in_model: mUSD
monetary_units_in_data: kUSD   # GLORIA table in thousand USD
firm_data_type: mrio
time_resolution: week

flow_coverage: 0.95
seed: 0

# Undisturbed by default: scenarios (the observed 2026 Strait record, the
# stylized arms) are written by the paper's drivers in disrupt-sc-studies/hormuz.
# The April scenario was one binary closure of the edge "Strait of Hormuz" from
# week 1 (the archived April file says duration 10; the April brief used 11).
# With no disruption and the early stop off, a disruption run is a stationarity
# check over t_final weeks.
simulation_type: disruption
t_final: 104
# Early stop OFF (read as SimParams.epsilon_stop): every Hormuz run uses the
# fixed horizon. With a value > 0, continue_disruption_run stops once t is past
# the last disruption START and losses are at or below it, whatever the
# disruption's duration - a run whose stocks still buffer an active Strait
# closure could stop early; and an undisturbed run would run one step only.
epsilon_stop_condition: 0
mc_repetitions: 0
export_files: True
# KI-33: the per-link and per-inventory step files are not needed by the
# Gulf analyses (firm/household/country series, routing summary, t=0 flows).
export_link_data: False
export_inventory_data: False
use_route_cache: True
country_transport_share: 0.2
firm_transport_share: 0.2

# 34-gateway paired criticality sweep of April 2026 (reused: material.md section 4)
