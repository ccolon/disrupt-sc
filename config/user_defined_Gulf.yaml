# -- Logistics (April values, except the retired keys) --
logistics:
  # Cargo classes. Sector keys take precedence over the sector-type keys of
  # default.yaml (agriculture, mining -> dry_bulk; oil_and_gas -> liquid_bulk;
  # default -> container).
  # - Oil -> crude: its own class, so that cargo_mode_eligibility can keep it
  #   on pipelines and ships, and the Strait shock can cut tankers per cargo.
  # - Gas -> lng: its own class (no engine change; plan section 4). LPG cannot
  #   be separated at 19 sectors.
  # - Refining -> liquid_bulk: sector_table_full.csv types Refining
  #   'manufacturing', which shipped refined products as containers in April
  #   (material.md D8); liquid_bulk is the oil_and_gas class. The data file is
  #   used as it is, so the 'type' column still says manufacturing where it is
  #   read for stocks: firm stocks of refined products 30 days either way here,
  #   household stocks 14 days (manufacturing) instead of the 7-day default.
  sector_to_cargo_type:
    Oil: crude
    Gas: lng
    Refining: liquid_bulk
  speeds:  # km/hour
    roads: 60       # Gulf highways are high quality
    maritime: 25    # average container vessel in Gulf waters
    airways: 800
  basic_cost:  # USD per ton*km
    roads: 0.09
    maritime: 0.003
    airways: 1.5    # air freight premium
    multimodal: 0.01
  border_crossing_fees:  # USD/ton - GCC has relatively low barriers
    roads: 30
    maritime: 20
    airways: 10
  border_crossing_times:  # hours
    roads: 2.0      # GCC borders are relatively smooth
    maritime: 4
    airways: 2
    multimodal: 3
  dwell_times:  # hours
    roads-maritime: 18
    roads-airways: 18
    roads-maritime-fujairah: 18
    roads-maritime-khor_fakkan: 18
    roads-pipelines-fujairah: 18
  loading_fees:  # USD/ton
    roads-maritime: 2.5
    roads-maritime-fujairah: 8
    roads-pipelines-fujairah: 8
    roads-maritime-khor_fakkan: 10
    roads-airways: 5.0
