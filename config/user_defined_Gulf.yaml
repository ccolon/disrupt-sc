# -- Agents (April values, except the two set by Hormuz decisions Q30 and Q31) --
# Give-up rule: a buyer drops a delivery whose freight bill rises more than this factor.
# Q31 (the user, 18 Nov 2026): 5 in the baseline (April value was 10, model default 2);
# 2, 10 and no cutoff (null) are sensitivities of the uncertainty runs (A22).
price_increase_threshold: 5
nb_suppliers_per_input: 1
weight_localization_firm: 1
weight_localization_household: 4
utilization_rate: 0.8
rationing_mode: "equal"
propagate_input_price_change: False
explicit_service_firm: True
# The 2 % materiality floor (Q30, the user, 18 Nov 2026): Firm.produce composes it with
# the survey matrix - an input below this share of the firm's input bill never binds,
# whatever its survey class - as in the EU scope and the Rhine paper's Methods.
critical_input_threshold: 0.02

# -- Inventories (April values; days) --
# Keyed on the sector_table 'type' of the INPUT. Oil and Gas are typed
# oil_and_gas there and take the default 30 days; Refining is typed
# manufacturing (30 days). The April comment "mining: 60 - strategic oil
# reserves are large" was wrong: mining is Coal and Mining only (material.md D8).
# Country-specific stocks (strategic reserves) are model change MC1.
enable_household_inventories: True
inventory_duration_targets:
  definition: per_input_type
  values:
    default: 30
    agriculture: 14    # food stocks: ~2 weeks
    manufacturing: 30
    mining: 60
    utility: 3
    service: 90
    trade: 30
    transport: 5
  unit: day
inventory_restoration_time: 4

# -- Which cargo may use which mode --
# Pipelines carry crude only: the Strait bypass lines (Petroline,
# Habshan-Fujairah) are crude lines, and refined products or gas let into the
# layer would bypass the Strait on them. Airways: containers only. Maritime and
# the multimodal connectors (not listed): every cargo.
# Crude is NOT barred from roads, although the target (node A1) was "crude on
# pipeline and sea only": with roads: [container, dry_bulk, liquid_bulk, lng]
# 394 of the 9,479 routable links have no route and the build stops (trial of
# 18 Nov 2026) - all of them crude, all routable again with crude on roads.
# The buyers of crude sit on road nodes (firms other than the oil and gas
# fields sit at their region's household centroid) and so does AFR's producer
# (Nairobi); a road leg is their only access to a pipeline or a port.
# Consequence, undisturbed run of 18 Nov 2026 (output/Gulf/20261118_100420,
# t=0): 3.32 Mt/week of crude from the Shaybah field cross the unnamed SAU-OMN
# border road edge into the Yibal-Mina al-Fahal pipeline (6 of the field's 8
# crude links then leave from port_sohar, outside the Strait; no
# Shaybah-Abqaiq line in the data); the King Fahd causeway carries 0.11
# Mt/week of crude. A leak at t=0, far above the A6 cap; 14 of the 20 border
# road edges are unnamed, so no capacity override can close them (KI-44).
# Tables: disrupt-sc-studies/hormuz/data/gulf_port/roads_border_t0.csv.
cargo_mode_eligibility:
  airways: [container]
  pipelines: [crude]

# -- Capacities --
# The capacity gate is on, but no edge has a capacity yet: the April
# capacities were tuned for the retired cost penalty (several "raised" or
# "boosted" by hand, 1,000 t/day placeholders) and 37 of their 102 edge-cargo
# constraints sit above the t=0 load on v2, which rations the undisturbed
# economy into collapse (material.md D2, D15; audit_20261117/v2_smoke). Design
# capacities and throughput come from nodes A3a/A3b and the calibration A4a;
# until then this scope runs uncapacitated. The April list, kept as the
# inventory of edges to source (tons/day, values NOT to be reused):
#   port_jebel_ali {container 80000, dry_bulk 37453, liquid_bulk 0}
#   port_khalifa {48308, 33275, 74668}       port_fujairah {20000, 3000, 23971}
#   port_khor_fakkan {31251, 3125, 23359}    port_hamad {41658, 29200, 0}
#   port_ras_laffan {0, 0, 30802}            port_shuwaikh {39782, 10510, 0}
#   port_mina_al_ahmadi {0, 0, 51813}        port_khalifa_bin_salman {15237, 8528, 8519}
#   port_ras_tanura {0, 0, 900000}           port_sohar {11017, 27801, 80000}
#   port_mina_al_fahal {1000, 1000, 1000}    port_qalhat {0, 0, 23774}
#   port_salalah {1000, 1000, 1000}          port_duqm {7543, 10000, 553}
#   port_jeddah_islamic {62882, 0, 0}        port_yanbu {0, 0, 120000}
#   port_dammam {61118, 0, 0}                port_king_abdullah {42856, 22800, 0}
#   port_umm_qasr {53438, 3399, 29781}       port_khor_al_zubair {1000, 1000, 1000}
#   port_al_maqal {5938, 13770, 11053}       port_imam_khomeini {93750, 35561, 277}
#   port_bushehr {1000, 1000, 1000}          port_bandar_abbas {50000, 1000, 1286}
#   port_bandar_lengeh {1000, 1000, 1000}    port_kharg_island {0, 0, 50312}
#   port_assaluyeh {0, 1000, 1000}           offshore_supply {66, 1885, 0}
#   border_crossing_al_batha_al_ghuwaifat 35000, border_crossing_abu_samra_salwa 16800,
#   border_crossing_nuwaiseeb_khafji 8400, border_crossing_king_fahd_causeway 9800,
#   border_crossing_al_ain_al_buraimi 9800, border_crossing_khatmat_malaha 7000.
# The April entry port_shahid_rajaee {1000, 1000, 1000} is dropped: no edge of
# transport.gpkg carries that name (April ignored it silently; v2 raises).
# Shahid Rajaee is the main terminal of the port of Bandar Abbas, which the
# network has as the lane port_bandar_abbas; a capacity for the port belongs
# there (one port, one lane) - not on a second, invented edge.
# The cargo keys of a future entry are the cargo types below:
# container, dry_bulk, liquid_bulk, crude, lng.
capacity_constraint: True
transport_capacity_overrides: {}

# -- Reporting (Hormuz node A26, decision Q28 item 12, 18 Nov 2026) --
# Outputs only, no result moves: with the three on, every other output is
# byte-identical on Testkistan (tests/test_reporting_outputs.py) and on a 6-week
# Gulf run (seed 0, same PYTHONHASHSEED).
# trade_by_region_sector.csv: per week, the cross-region deliveries by seller region,
# seller sector and buyer region (quantity as in trade_data.csv, and tons) - the
# scorer's exports and imports; link_data.csv stays off (KI-33).
export_trade_by_region_sector: True
# logistics_report.csv and the per-edge flow files at every week, not weeks 0 and 1
# only (KI-73).
export_logistics_every_step: True
# Every named edge of the network, watched without a capacity: the 94 distinct names
# of disrupt-sc-studies/hormuz/data/capacity/network_named_edges.csv (114 rows,
# sha256 dd80c8f879b95813), in its order: 6 border crossings, 62 sea edges (the
