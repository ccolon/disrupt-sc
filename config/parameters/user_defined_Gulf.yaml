# ─────────────────────────────────────────────────────
# Gulf Hormuz Blockade Scenario
# ─────────────────────────────────────────────────────
# Estimates impact of Strait of Hormuz closure on
# food prices and commodity imports in Gulf states.
#
# Internal: ARE, SAU, QAT, KWT, BHR, OMN, IRQ
# External: IND, PAK, EAS, EUR, AFR, ROW
# ─────────────────────────────────────────────────────

# ── Data paths ──
filepaths:
  "mrio": "Economic/mrio.csv"
  "sector_table": "Economic/sector_table.csv"
  "usd_per_ton": "Economic/usd_per_ton.csv"

# ── Transport ──
transport_modes: ["roads", "maritime", "airways"]
capacity_constraint: "off"

# ── Economic settings ──
monetary_units_in_model: "mUSD"
monetary_units_in_data: "mUSD"
firm_data_type: "mrio"

# ── Time ──
time_resolution: "day"
t_final: 10  # 3 months of blockade

# ── Filtering ──
# Eora26 values are in USD (not millions), so cutoffs need to be appropriate
io_cutoff: 0.01
cutoff_sector_output:
  type: "absolute"
  value: 100
  unit: "kUSD"
cutoff_sector_demand:
  type: "absolute"
  value: 100
  unit: "kUSD"
cutoff_firm_output:
  type: "absolute"
  value: 10
  unit: "kUSD"
cutoff_household_demand:
  type: "absolute"
  value: 10
  unit: "kUSD"

# ── Agent settings ──
nb_suppliers_per_input: 1
weight_localization_firm: 1
weight_localization_household: 4
utilization_rate: 0.8
rationing_mode: "equal"
propagate_input_price_change: True
explicit_service_firm: True

# ── Inventory ──
# Gulf states rely heavily on imports; inventories tend to be short for perishables
inventory_duration_targets:
  definition: per_input_type
  values:
    default: 30
    agriculture: 14    # food stocks: ~2 weeks
    manufacturing: 30
    mining: 60         # strategic oil reserves are large
    utility: 3
    service: 90
    trade: 30
    transport: 5
  unit: day
inventory_restoration_time: 4

# ── Logistics ──
logistics:
  speeds:  # km/hour
    roads: 60       # Gulf highways are high quality
    maritime: 25    # average container vessel in Gulf waters
    airways: 800
  basic_cost:  # USD per ton*km
    roads: 0.08
    maritime: 0.003
    airways: 1.5    # air freight premium
    multimodal: 0.01
  border_crossing_fees:  # USD/ton — GCC has relatively low barriers
    roads: 15
    maritime: 20
    airways: 10
  border_crossing_times:  # hours
    roads: 1.0      # GCC borders are relatively smooth
    maritime: 4
    airways: 2
    multimodal: 3
  dwell_times: # hours
    roads-maritime: 18
    roads-airways: 18
  loading_fees: # USD/ton
    roads-maritime: 2.5
    roads-airways: 5.0

# ── Simulation ──
simulation_type: "disruption"
mc_repetitions: 0  # deterministic first run; increase for stochastic
export_files: True
use_route_cache: True

# ── Disruption: Hormuz Strait Blockade ──
# Block all edges passing through the Strait of Hormuz
# This forces rerouting via Red Sea / Suez / air / overland
disruptions:
  - type: transport_disruption
    description_type: edge_attributes
    attribute: name
    values:
      - "Strait of Hormuz"            # main strait edge (id 95)
      - "Hormuz north - Dubai hub"     # approaches from north
      - "Hormuz north - Qatar-Bahrain hub"
      - "Hormuz south - Muscat approach N"  # approaches from south
      - "Hormuz south - Muscat approach S"
      - "Hormuz south - Gwadar approach"
    start_time: 1
    duration: 7  # 60-day blockade

# ── Stop condition ──
epsilon_stop_condition: 1e-3

# ── Route optimization ──
route_optimization_weight: "cost_per_ton"
price_increase_threshold: 2
