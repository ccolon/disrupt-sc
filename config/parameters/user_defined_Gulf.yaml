# ── Simulation ──
simulation_type: "disruption"  # disruption initial_state
mc_repetitions: 0  # deterministic first run; increase for stochastic
export_files: True
use_route_cache: True

# ── Disruption: Hormuz Strait Blockade ──
# Block all edges passing through the Strait of Hormuz
# This forces rerouting via Red Sea / Suez / air / overland
disruptions:
  - type: transport_disruption
    description_type: edge_attributes
    attribute: name
    values:
      - "Strait of Hormuz"
    start_time: 1
    duration: 4  # 60-day blockade

# ── Stop condition ──
epsilon_stop_condition: 1e-3

# ── Route optimization ──
route_optimization_weight: "cost_per_ton"
price_increase_threshold: 2
