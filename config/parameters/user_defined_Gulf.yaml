# ─────────────────────────────────────────────────────
# Gulf Hormuz Blockade Scenario
# ─────────────────────────────────────────────────────
# Estimates impact of Strait of Hormuz closure on
# food prices and commodity imports in Gulf states.
#
# Internal: ARE, SAU, QAT, KWT, BHR, OMN, IRQ
# External: IND, PAK, EAS, EUR, AFR, ROW
# ─────────────────────────────────────────────────────

# ── Data paths ──
filepaths:
  "mrio": "Economic/mrio_full.csv"
  "sector_table": "Economic/sector_table_full.csv"

# ── Transport ──
transport_modes: ["roads", "maritime", "airways", "pipelines"]

# ── Economic settings ──
monetary_units_in_model: "mUSD"
monetary_units_in_data: "kUSD"
firm_data_type: "mrio"

# ── Time ──
time_resolution: "week"
t_final: 52

# ── Filtering ──
io_cutoff: 0.80  # cumulative input coverage: keep inputs covering 80% of each buyer's intermediate consumption
cutoff_sector_output:
  type: "absolute"
  value: 1
  unit: "kUSD"
cutoff_sector_demand:
  type: "absolute"
  value: 1
  unit: "kUSD"
cutoff_firm_output:
  type: "absolute"
  value: 1
  unit: "kUSD"
cutoff_household_demand:
  type: "absolute"
  value: 1
  unit: "kUSD"



# ── Simulation ──
simulation_type: "disruption"
mc_repetitions: 0  # deterministic first run; increase for stochastic
export_files: True
use_route_cache: True
country_transport_share: 0.2
firm_transport_share: 0.2

criticality:
  duration: 5
  scenarios:
    - ["port_jebel_ali"]
    - ["Strait of Hormuz", "port_jebel_ali"]
    - ["port_khalifa"]
    - ["Strait of Hormuz", "port_khalifa"]
    - ["port_fujairah"]
    - ["Strait of Hormuz", "port_fujairah"]
    - ["port_khor_fakkan"]
    - ["Strait of Hormuz", "port_khor_fakkan"]
    - ["port_hamad"]
    - ["Strait of Hormuz", "port_hamad"]
    - ["port_ras_laffan"]
    - ["Strait of Hormuz", "port_ras_laffan"]
    - ["port_shuwaikh"]
    - ["Strait of Hormuz", "port_shuwaikh"]
    - ["port_mina_al_ahmadi"]
    - ["Strait of Hormuz", "port_mina_al_ahmadi"]
    - ["port_khalifa_bin_salman"]
    - ["Strait of Hormuz", "port_khalifa_bin_salman"]
    - ["port_ras_tanura"]
    - ["Strait of Hormuz", "port_ras_tanura"]
    - ["port_sohar"]
    - ["Strait of Hormuz", "port_sohar"]
    - ["port_mina_al_fahal"]
    - ["Strait of Hormuz", "port_mina_al_fahal"]
    - ["port_qalhat"]
    - ["Strait of Hormuz", "port_qalhat"]
    - ["port_salalah"]
    - ["Strait of Hormuz", "port_salalah"]
    - ["port_duqm"]
    - ["Strait of Hormuz", "port_duqm"]
    - ["port_jeddah_islamic"]
    - ["Strait of Hormuz", "port_jeddah_islamic"]
    - ["port_yanbu"]
    - ["Strait of Hormuz", "port_yanbu"]
    - ["port_dammam"]
    - ["Strait of Hormuz", "port_dammam"]
    - ["port_king_abdullah"]
    - ["Strait of Hormuz", "port_king_abdullah"]
    - ["port_umm_qasr"]
    - ["Strait of Hormuz", "port_umm_qasr"]
    - ["port_khor_al_zubair"]
    - ["Strait of Hormuz", "port_khor_al_zubair"]
    - ["port_al_maqal"]
    - ["Strait of Hormuz", "port_al_maqal"]
    - ["port_imam_khomeini"]
    - ["Strait of Hormuz", "port_imam_khomeini"]
    - ["port_bushehr"]
    - ["Strait of Hormuz", "port_bushehr"]
    - ["port_bandar_abbas"]
    - ["Strait of Hormuz", "port_bandar_abbas"]
    - ["port_bandar_lengeh"]
    - ["Strait of Hormuz", "port_bandar_lengeh"]
    - ["port_kharg_island"]
    - ["Strait of Hormuz", "port_kharg_island"]
    - ["port_assaluyeh"]
    - ["Strait of Hormuz", "port_assaluyeh"]
    - ["border_crossing_al_batha_al_ghuwaifat"]
    - ["Strait of Hormuz", "border_crossing_al_batha_al_ghuwaifat"]
    - ["border_crossing_abu_samra_salwa"]
    - ["Strait of Hormuz", "border_crossing_abu_samra_salwa"]
    - ["border_crossing_nuwaiseeb_khafji"]
    - ["Strait of Hormuz", "border_crossing_nuwaiseeb_khafji"]
    - ["border_crossing_king_fahd_causeway"]
    - ["Strait of Hormuz", "border_crossing_king_fahd_causeway"]
    - ["border_crossing_al_ain_al_buraimi"]
    - ["Strait of Hormuz", "border_crossing_al_ain_al_buraimi"]
    - ["border_crossing_khatmat_malaha"]
    - ["Strait of Hormuz", "border_crossing_khatmat_malaha"]

# ── Disruption: Hormuz Strait Blockade ──
# Block the Strait of Hormuz chokepoint edge
disruptions:
  - type: transport_disruption
    description_type: edge_attributes
    attribute: name
    values:
      - "Strait of Hormuz"
    start_time: 1
    duration: 10  # blockade duration

# ── Stop condition ──
epsilon_stop_condition: 0  # disabled — always run full t_final

# ── Route optimization ──
route_optimization_weight: "cost_per_ton"
price_increase_threshold: 10

# ── Agent settings ──
nb_suppliers_per_input: 1
weight_localization_firm: 1
weight_localization_household: 4
utilization_rate: 0.8
rationing_mode: "equal"
propagate_input_price_change: False
explicit_service_firm: True

# ── Inventory ──
enable_household_inventories: True
# Gulf states rely heavily on imports; inventories tend to be short for perishables
inventory_duration_targets:
  definition: per_input_type
  values:
    default: 30
    agriculture: 14    # food stocks: ~2 weeks
    manufacturing: 30
    mining: 60         # strategic oil reserves are large
    utility: 3
    service: 90
    trade: 30
    transport: 5
  unit: day
inventory_restoration_time: 4

# ── Logistics ──
logistics:
  initial_route_assignment: "edge_lp"
  speeds:  # km/hour
    roads: 60       # Gulf highways are high quality
    maritime: 25    # average container vessel in Gulf waters
    airways: 800
  basic_cost:  # USD per ton*km
    roads: 0.09
    maritime: 0.003
    airways: 1.5    # air freight premium
    multimodal: 0.01
  border_crossing_fees:  # USD/ton — GCC has relatively low barriers
    roads: 30
    maritime: 20
    airways: 10
  border_crossing_times:  # hours
    roads: 2.0      # GCC borders are relatively smooth
    maritime: 4
    airways: 2
    multimodal: 3
  dwell_times: # hours
    roads-maritime: 18
    roads-airways: 18
    roads-maritime-fujairah: 18
    roads-maritime-khor_fakkan: 18
    roads-pipelines-fujairah: 18
  loading_fees: # USD/ton
    roads-maritime: 2.5
    roads-maritime-fujairah: 8
    roads-pipelines-fujairah: 8
    roads-maritime-khor_fakkan: 10
    roads-airways: 5.0
  chunk_size: 10000  # tons/day

# Override default transport capacity: block containers on airways
default_transport_capacity:
  airways:
    container: 5000       # containers cannot fly
    dry_bulk: 0
    liquid_bulk: 0
  roads:
    container: 100000
    dry_bulk: 100000
    liquid_bulk: 30000       # tanker trucks along Hormuz bypass corridors (~900 trucks/day)

capacity_constraint: "gradual"
# Capacity = F_i / margin.  margin = 0.8 for container/dry_bulk (20% headroom),
# 0.95 for liquid_bulk (5% headroom).  Ports with zero baseline flow keep a
# small rerouting buffer.
transport_capacity_overrides:  # tons/day
  port_jebel_ali:
    container: 80000         # raised to keep Jebel Ali the default ARE container gateway
    dry_bulk: 37453
    liquid_bulk: 0
