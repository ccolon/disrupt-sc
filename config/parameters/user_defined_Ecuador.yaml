# File paths are relative to the scope folder in the resolved data root.
filepaths:
  "usd_per_ton": "Economic/sector_table.csv"
transport_modes: [roads, maritime, waterways, airways]
monetary_units_in_model: mUSD
monetary_units_in_data: kUSD
time_resolution: day
with_transport: True
price_increase_threshold: 5
utilization_rate: 1
adaptive_inventories: True
inventory_restoration_time: 90
nb_suppliers_per_input: 1
adaptive_supplier_weight: False
transport_to_households: True
logistics:
  basic_cost:
    roads: 0.01
inventory_duration_targets:
  definition: per_input_type  # Options: global, per_input_type
  values:
#    utility: 3
#    agriculture: 15
#    manufacturing: 30
#    service: 90
#    trade: 30
#    construction: 30
#    transport: 5
    default: 3
  unit: day
enable_household_inventories: True
household_inventory_duration_target:
  values:
    default: 7  # Days of consumption buffered (global default)
  unit: day
io_cutoff: 0.01  # 0.01
cutoff_sector_output:
  'type': absolute
  'value': 1000
  'unit': kUSD
cutoff_sector_demand:
  'type': absolute
  'value': 1000
  'unit': kUSD
simulation_type: disruption  # initial_state, disruption
sensitivity:
  utilization_rate: [0.2, 1]
  adaptive_supplier_weight: [True, False]
  adaptive_inventories: [True, False]
  nb_suppliers_per_input: [1, 4]
  inventory_duration_targets.values.utility: [3, 15]
  inventory_duration_targets.values.transport: [3, 15]
t_final: 30
epsilon_stop_condition: 0
mc_repetitions: 0
export_files: True
capital_to_value_added_ratio: 3
capacity_constraint: False
disruptions:
  - type: transport_disruption
    description_type: edge_attributes
    attribute: disruption
    values: [ Scenario 0_20 ]  # Disrupt Main Road North
    start_time: 1
    duration: 7
  - type: capital_destruction
    start_time: 1
#    description_type: region_sector_file
    description_type: filter  # sectors_homogeneous
    filter:
      region_sector: ['ECU_TRA', 'ECU_INM']
#      subregion_province: ['AZUAY']
#      province_sector: ['AZUAY_TRA', 'AZUAY_INM']
    destroyed_capital: 510.0
#    region_sector_filepath: "Disruption/earthquake_capital_destruction.csv"
    unit: mUSD
    reconstruction_market: False
