# Transaction-based data mode configuration for Ecuador
# This demonstrates the new transaction_based firm_data_type

# Use transaction-based data ingestion
firm_data_type: "transaction_based"

# Override default filepaths for transaction mode
filepaths:
  # Transaction-based economic data
  "firm_table": "Economic/firms.geojson"
  "transaction_table": "Economic/transaction_table.csv"
  "final_demand": "Economic/final_demand.csv"
  "exports": "Economic/exports.csv"
  "imports": "Economic/imports.csv"

  # Spatial data (keep existing)
  "households_spatial": "Spatial/households.geojson"
  "countries_spatial": "Spatial/countries.geojson"

# Standard Ecuador configuration
logging_level: info
monetary_units_in_model: mUSD
monetary_units_in_data: mUSD
time_resolution: day
with_transport: False

# Inventory settings
inventory_duration_targets:
  definition: per_input_type
  values:
    utility: 3
    agriculture: 15
    manufacturing: 30
    service: 90
    trade: 30
    construction: 30
    transport: 5
    default: 30
  unit: day

# Model parameters
io_cutoff: 0.1
utilization_rate: 1
adaptive_inventories: True
inventory_restoration_time: 90
nb_suppliers_per_input: 1
adaptive_supplier_weight: False
price_increase_threshold: 2
cutoff_household_demand:
  'type': 'absolute'
  'value': 0.0
  'unit': 'kUSD'

# Simulation settings
simulation_type: initial_state
t_final: 30
mc_repetitions: 0
export_files: True
capital_to_value_added_ratio: 3
capacity_constraint: False