# ============================================================================
# Gulf19 scope - the Gulf scope (config/user_defined_Gulf.yaml) on a 19-region
# MRIO (Hormuz 2026 paper, decision Q15, node A21; 18 Nov 2026).
# Every key and value below is that of user_defined_Gulf.yaml at 9b4cc6d (the
# body is copied unchanged, comments included: the facts they quote - link
# counts, t=0 tonnes, the 24 Apr edit - were measured on the Gulf scope). The
# scope differs only by its data folder, disrupt-sc-data/Gulf19:
#
# MRIO: GLORIA 2023, 19 regions x 19 sectors, CLOSED (no rest-of-world import
#   rows, no export column): ARE SAU IRQ IRN OMN BHR KWT QAT CHN IND PAK TUR
#   JPN KOR BGD EUR AFR EAS RoW. JPN and KOR come out of EAS, BGD out of RoW,
#   EUR = EU27 + GBR + NOR + CHE + ISL (31 GLORIA regions) out of RoW. Same
#   sectors, year and units (kUSD) as the Gulf table. Every region is a
#   firm/household region, 0 country agents.
#   Extraction (KI-05 resolved for GLORIA): onboarding/scripts/gloria_extract.py
#   with onboarding/mrio_specs/gulf/gulf19.yaml (region membership and the
#   GLORIA 120 -> 19 sector concordance as tables); input and output sha256 in
#   Gulf19/Economic/mrio_full.provenance.json. The same script and
#   gulf15.yaml reproduce the Gulf table and sector table byte for byte.
# Spatial and transport: built from disrupt-sc-data/Gulf (read only) by
#   onboarding/scripts/gulf19_build_scope.py (sha256 in Gulf19/scope_build.json):
#   the Gulf files unchanged + for JPN (Yokohama), KOR (Busan) and BGD
#   (Chittagong) a household point, a country entry, a road stub, a sea edge
#   from the network (Malacca junction for JPN and KOR, south of Sri Lanka for
#   BGD), an airport with an air route, and the roads-maritime and
#   roads-airways connectors - the pieces the other external regions have.
#   EUR uses the Frankfurt point, sea edge and airport already in the Gulf
#   files (unused there). The roads layer gains 3 edges, so every model edge id
#   from the maritime layer on is shifted against the Gulf scope: compare
#   edges by name. When the Gulf network data change (node A1b), re-run the
#   build script.
# Node A1b (decision Q23, 18 Nov 2026): Gulf19/{Spatial,Transport} rebuilt by
#   that script from the edited Gulf files (disrupt-sc-data 903df63, Gulf19 at
#   56e6426; Gulf/Transport/EDITS.md: Shaybah-Abqaiq line connected, border
#   road edges named, port_salalah and port_khor_al_zubair connected, the Ras
#   Laffan and Assaluyeh pass-through connectors deleted), and the same config
#   changes as user_defined_Gulf.yaml:
#   crude barred from 19 border road edges (transport_capacity_overrides), the
#   15 new names added to monitored_edges, the comments on them.
# ============================================================================

filepaths:
  mrio: "Economic/mrio_full.csv"
  sector_table: "Economic/sector_table_full.csv"
  # firms.geojson: 35 oil and gas fields (Oil/Gas columns); the firms of every
  # other region_sector sit at the centroid of their region's household points
  firms_spatial: "Spatial/firms.geojson"
  households_spatial: "Spatial/households.geojson"
  countries_spatial: "Spatial/countries.geojson"
  transport: "Transport/transport.gpkg"
  multimodal: "Transport/multimodal.gpkg"
  # Partially-binding Leontief (Hormuz A2, Q30): the same 19 x 19 sector matrix as Gulf
  input_criticality: "Economic/input_criticality_ihs_outw.csv"

transport_modes: [roads, maritime, airways, pipelines]
with_transport: True

monetary_units_in_model: mUSD
monetary_units_in_data: kUSD   # GLORIA table in thousand USD
firm_data_type: mrio
time_resolution: week

flow_coverage: 0.95
seed: 0

# Undisturbed by default: scenarios (the observed 2026 Strait record, the
# stylized arms) are written by the paper's drivers in disrupt-sc-studies/hormuz.
# The April scenario was one binary closure of the edge "Strait of Hormuz" from
# week 1 (the archived April file says duration 10; the April brief used 11).
# With no disruption and the early stop off, a disruption run is a stationarity
# check over t_final weeks.
simulation_type: disruption
t_final: 104
# Early stop OFF (read as SimParams.epsilon_stop): every Hormuz run uses the
# fixed horizon. With a value > 0, continue_disruption_run stops once t is past
# the last disruption START and losses are at or below it, whatever the
# disruption's duration - a run whose stocks still buffer an active Strait
# closure could stop early; and an undisturbed run would run one step only.
epsilon_stop_condition: 0
mc_repetitions: 0
export_files: True
# KI-33: the per-link and per-inventory step files are not needed by the
# Gulf analyses (firm/household/country series, routing summary, t=0 flows).
export_link_data: False
export_inventory_data: False
use_route_cache: True
country_transport_share: 0.2
firm_transport_share: 0.2

# 34-gateway paired criticality sweep of April 2026 (reused: material.md section 4)
criticality:
  duration: 5
  scenarios:
