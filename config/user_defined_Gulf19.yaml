# -- Agents (April values) --
# Q31 (the user, 18 Nov 2026): 5 in the baseline; 2, 10 and no cutoff (null) in A22
price_increase_threshold: 5
nb_suppliers_per_input: 1
weight_localization_firm: 1
weight_localization_household: 4
utilization_rate: 0.8
rationing_mode: "equal"
propagate_input_price_change: False
explicit_service_firm: True
# Q30 (the user, 18 Nov 2026): the 2 % materiality floor, composed with the survey matrix
critical_input_threshold: 0.02

# -- Inventories (April values; days) --
# Keyed on the sector_table 'type' of the INPUT. Oil and Gas are typed
# oil_and_gas there and take the default 30 days; Refining is typed
# manufacturing (30 days). The April comment "mining: 60 - strategic oil
# reserves are large" was wrong: mining is Coal and Mining only (material.md D8).
# Country-specific stocks (strategic reserves) are model change MC1.
enable_household_inventories: True
inventory_duration_targets:
  definition: per_input_type
  values:
    default: 30
    agriculture: 14    # food stocks: ~2 weeks
    manufacturing: 30
    mining: 60
    utility: 3
    service: 90
    trade: 30
    transport: 5
  unit: day
inventory_restoration_time: 4

# -- Country stock depths (Hormuz node A12, model change MC1, 18 Nov 2026) --
# Days of use per input SECTOR (Gulf19 sector names), for the firms and the
# households located in the region; they replace the per-type days above for
# those inputs only. Block copied from disrupt-sc-studies/hormuz/calibration/
# stocks_by_region_draft.yaml; every value is a row of
# hormuz/data/stocks/stock_cover.csv or stock_cover_bloc_means.csv (evidence
# node D7): IEA Oil Market Report 12 Aug 2026, Table 5, end Dec 2025 (pre-war).
# IEA days = total stocks on land (industry + government, crude + products) in
# days of FORWARD DEMAND, not days of net imports; the same figure is given to
# Oil (crude) and Refining (products). The IEA collective release of 11 Mar
# 2026 is NOT here: a policy reaction, for the ex-post run (Q24, node A13).
# Regions left to the generic days above: ARE SAU IRQ IRN OMN BHR KWT QAT (net
# exporters, no import cover found), CHN and IND (no days figure), AFR and EAS
# (no member in the IEA table), and Gas everywhere (no days of cover found).
# MC1 caveats: stocks above target are never drawn down; household stocks only
# with enable_household_inventories (on here); the adjusted targets per region
# are logged at build ("inventory_duration_targets_by_region [...]", KI-36).
inventory_duration_targets_by_region:
  JPN: {Oil: 156, Refining: 156}   # stock_cover.csv JPN/oil: total stocks on land, 156 days of forward demand, end Dec 2025
  KOR: {Oil: 75, Refining: 75}     # KOR/oil 75 days, end Dec 2025
  TUR: {Oil: 94, Refining: 94}     # TUR/oil 94 days, end Dec 2025
  EUR: {Oil: 111, Refining: 111}   # bloc mean 111.14 (net-import-weighted, 25 of 31 members, 96 % of bloc net imports)
  RoW: {Oil: 64, Refining: 64}     # bloc mean 63.73 (AUS CHL NZL USA only, 68 % of bloc net imports) - the weakest value
  PAK: {Refining: 28}              # PAK/oil petrol and diesel cover 28 days each, OGRA, 2 Mar 2026 (product cover)
  BGD: {Refining: 15}              # derived 15.3: BPC 4 Mar 2026 diesel 201,610 t/14 d, petrol 21,705 t/17 d, octane 34,133 t/31 d

# -- Which cargo may use which mode --
# Pipelines carry crude only: the Strait bypass lines (Petroline,
# Habshan-Fujairah) are crude lines, and refined products or gas let into the
# layer would bypass the Strait on them. Airways: containers only. Maritime and
# the multimodal connectors (not listed): every cargo.
# Crude is NOT barred from roads, although the target (node A1) was "crude on
# pipeline and sea only": with roads: [container, dry_bulk, liquid_bulk, lng]
# 394 of the 9,479 routable links have no route and the build stops (trial of
# 18 Nov 2026) - all of them crude, all routable again with crude on roads.
# The buyers of crude sit on road nodes (firms other than the oil and gas
# fields sit at their region's household centroid) and so does AFR's producer
# (Nairobi); a road leg is their only access to a pipeline or a port.
# Consequence on the A1 data (undisturbed run output/Gulf/20261118_100420,
# t=0): 3.32 Mt/week of crude from the Shaybah field crossed the then unnamed
# SAU-OMN border road edge into the Yibal-Mina al-Fahal pipeline and left from
# port_sohar (the Shaybah-Abqaiq line was in the data but dead-ended); the King
# Fahd causeway carried 0.11 Mt/week of crude (KI-68; tables
# disrupt-sc-studies/hormuz/data/gulf_port/roads_border_t0.csv). Fixed by the
# A1b data edits and the crude caps of the border roads below (Q23).
cargo_mode_eligibility:
  airways: [container]
  pipelines: [crude]

# -- Capacities --
# Since node A4a (18 Nov 2026) the gateways carry the capacities of decision
# Q27 (block at the end of transport_capacity_overrides below). Until then the
# gate was on with no capacity: the April capacities were tuned for the
# retired cost penalty (several "raised" or "boosted" by hand, 1,000 t/day
# placeholders) and 37 of their 102 edge-cargo constraints sit above the t=0
# load on v2, which rations the undisturbed economy into collapse (material.md
# D2, D15; audit_20261117/v2_smoke). The April list, kept as the inventory of
# edges to source (tons/day, values NOT to be reused):
#   port_jebel_ali {container 80000, dry_bulk 37453, liquid_bulk 0}
#   port_khalifa {48308, 33275, 74668}       port_fujairah {20000, 3000, 23971}
#   port_khor_fakkan {31251, 3125, 23359}    port_hamad {41658, 29200, 0}
#   port_ras_laffan {0, 0, 30802}            port_shuwaikh {39782, 10510, 0}
#   port_mina_al_ahmadi {0, 0, 51813}        port_khalifa_bin_salman {15237, 8528, 8519}
#   port_ras_tanura {0, 0, 900000}           port_sohar {11017, 27801, 80000}
#   port_mina_al_fahal {1000, 1000, 1000}    port_qalhat {0, 0, 23774}
#   port_salalah {1000, 1000, 1000}          port_duqm {7543, 10000, 553}
#   port_jeddah_islamic {62882, 0, 0}        port_yanbu {0, 0, 120000}
#   port_dammam {61118, 0, 0}                port_king_abdullah {42856, 22800, 0}
#   port_umm_qasr {53438, 3399, 29781}       port_khor_al_zubair {1000, 1000, 1000}
#   port_al_maqal {5938, 13770, 11053}       port_imam_khomeini {93750, 35561, 277}
#   port_bushehr {1000, 1000, 1000}          port_bandar_abbas {50000, 1000, 1286}
#   port_bandar_lengeh {1000, 1000, 1000}    port_kharg_island {0, 0, 50312}
#   port_assaluyeh {0, 1000, 1000}           offshore_supply {66, 1885, 0}
#   border_crossing_al_batha_al_ghuwaifat 35000, border_crossing_abu_samra_salwa 16800,
#   border_crossing_nuwaiseeb_khafji 8400, border_crossing_king_fahd_causeway 9800,
#   border_crossing_al_ain_al_buraimi 9800, border_crossing_khatmat_malaha 7000.
# The April entry port_shahid_rajaee {1000, 1000, 1000} is dropped: no edge of
# transport.gpkg carries that name (April ignored it silently; v2 raises).
# Shahid Rajaee is the main terminal of the port of Bandar Abbas, which the
# network has as the lane port_bandar_abbas; a capacity for the port belongs
# there (one port, one lane) - not on a second, invented edge.
# The cargo keys of a future entry are the cargo types below:
# container, dry_bulk, liquid_bulk, crude, lng.
#
# The entries below are not capacities: a 0 bars crude from an edge at build
# (no cost label, so no crude route uses it and the gate has nothing to cut
# there); the other cargoes keep the edge uncapacitated. Crude is barred
# from the border road edges (Hormuz decision Q23, node A1b, 18 Nov 2026), so
# that no crude leaves the Gulf by road outside the Strait accounting: the A6
# leakage limit is < 50 kb/d cross-border by road or rail in all, ~47.7 kt per
# weekly step at 7.33 bbl/t. Tried first (Gulf): crude 0 on all 20 border road
# edges -> 131 crude links without a route, every one with AFR's Nairobi node at
# an end (border_road_AFR_AFR_1, Mombasa-Nairobi, is AFR's only road between its
# agents and its sea edge). That edge is AFR's internal access road (both ends
# in Kenya, tagged border in the data), not a crossing between two economies:
# it keeps no crude cap - any cap under its t=0 crude load would ration AFR's
# crude trade in the undisturbed run - and is outside the cross-border total.
# The 19 others are closed to crude; every crude link stays routable.
# Edge names: disrupt-sc-data/Gulf/Transport/EDITS.md (step 3).
capacity_constraint: True
transport_capacity_overrides:
  border_crossing_al_ain_al_buraimi: {crude: 0}
  border_crossing_al_batha_al_ghuwaifat: {crude: 0}
  border_crossing_abu_samra_salwa: {crude: 0}
  border_crossing_nuwaiseeb_khafji: {crude: 0}
  border_crossing_king_fahd_causeway: {crude: 0}
  border_crossing_khatmat_malaha: {crude: 0}
  border_road_SAU_ARE_1: {crude: 0}
  border_road_SAU_ARE_2: {crude: 0}
  border_road_SAU_ARE_3: {crude: 0}
  border_road_SAU_QAT_1: {crude: 0}
  border_road_SAU_QAT_2: {crude: 0}
  border_road_SAU_KWT_1: {crude: 0}
  border_road_SAU_KWT_2: {crude: 0}
  border_road_SAU_KWT_3: {crude: 0}
  border_road_ARE_OMN_1: {crude: 0}
  border_road_SAU_OMN_1: {crude: 0}
  border_road_IRQ_IRN_1: {crude: 0}
  border_road_IRQ_IRN_2: {crude: 0}
  border_road_IRQ_KWT_1: {crude: 0}
  # ---- Gateway capacities (Hormuz node A4a, decision Q27, 18 Nov 2026), surge 1.0 ----
  # Tonnes per DAY (x7 per weekly step). Source: disrupt-sc-studies/hormuz/calibration/
  # capacity_table.csv and capacity_overrides_draft.yaml (every row has its V-id in
  # hormuz/data/capacity/gateways_capacity.csv). A number = one capacity shared by all
  # cargo; a dict = per cargo; a cargo not listed is uncapped. Rule (Q27): lanes inside the
  # Strait take their maximum 2023-25 throughput (official statistic, else PortWatch AIS
  # estimate, MODELLED); lanes outside take the terminal or operator design statement where
  # one exists, else the same proxy. Gaps left uncapped (no PortWatch port or < 50 calls a
  # year): port_al_maqal, port_khalifa_bin_salman, port_bandar_lengeh, port_khor_al_zubair,
  # port_mina_al_fahal; feeder pipelines and border crossings uncapacitated (Q27).
  # Container design capacities in TEU (Khor Fakkan V071 5.0 M, Sohar V070 2.0 M, Fujairah
  # V012 0.72 M, Salalah V022 6.0 M TEU/yr) converted at 8.07 t of goods per TEU handled:
  # Eurostat main ports, EU27 2022-2024 mean (9.90 t per laden TEU, 18.6 % empty), gross
  # weight of goods without container tare - the weight the model's tonnes stand for
  # (hormuz/scripts/a4a_teu_factor.py, calibration/teu_factor.csv; range 6.93-10.11 for A22).
  # Crude nameplates of the bypass system (Q23: "pipeline costs and nameplates stay
  # calibration levers for A4a"): Yanbu loading terminals V046 and Petroline V047 5.0 mb/d,
  # Habshan-Fujairah V016 1.8 mb/d (EIA; ADNOC nameplate 1.5), Kirkuk-Ceyhan V093 0.75 mb/d,
  # at 7.33 bbl/t.
  # FALLBACK (A4a round 3, 19 Nov 2026; the A4b rule, Q27 option 2, the Rhine method): six
  # lanes inside the Strait take the modelled baseline x headroom 1.3 instead of their
  # PortWatch proxy - Shuwaikh, Kharg, Hamad, Imam Khomeini, Ras Tanura, Mina al Ahmadi
  # (marked FALLBACK below; baseline = round-2 routed tonnes per week before the gate, / 7).
  # No reallocation between an economy's lanes could clear them: summed over the economy,
  # the lanes' baseline is 4.3 x their PortWatch capacities in Kuwait, 1.17 x in Qatar,
  # 2.5 x on the Saudi east coast (Petroline-Yanbu already at its 2024-25 statistic), and
  # Iran's crude has no terminal but Kharg (6.2 x) outside the uncapped gap lanes
  # (hormuz/calibration/rounds/, a4a_feasibility.py). The proxies are AIS undercounts of
  # oil terminals and commercial ports (Kharg 8.2 Mt against Iran's crude exports).
  port_assaluyeh: 348096          # all cargo; V219 PortWatch (modelled), 2025: 127 Mt, an anomalous jump from 17.8 Mt
  port_bandar_abbas: 64084        # all cargo; V202,V205 PortWatch (modelled)
  port_bushehr: 4972              # all cargo; V208 PortWatch (modelled)
  port_dammam: 142192             # all cargo; V031 official statistic (GASTAT 51.9 Mt, 2024)
  port_das_island: 16245          # all cargo; V221 PortWatch (modelled)
  port_duqm: 14682                # all cargo; V162 PortWatch (modelled)
  port_fujairah:
    container: 15911              # V012 design 720,000 TEU/yr x 8.07 t/TEU
    dry_bulk: 35689               # V153 PortWatch dry bulk + general cargo + ro-ro (modelled)
    liquid_bulk: 214432           # V151 PortWatch tanker pool (modelled)
    lng: 214432                   # V151 idem (one tanker pool applied to each)
  port_hamad: 119677              # FALLBACK 644,413 t/week x 1.3 / 7 (proxy V195 PortWatch 17,620)
  port_imam_khomeini: 365157      # FALLBACK 1,966,228 t/week x 1.3 / 7 (proxy V212 PortWatch 55,387)
  port_jebel_ali: 639071          # all cargo; V144 PortWatch (modelled)
  port_jeddah_islamic: 148219     # all cargo; V026 official statistic (GASTAT 54.1 Mt, 2025)
  port_khalifa: 101913            # all cargo; V147 PortWatch (modelled)
  port_kharg_island: 183532       # FALLBACK 988,250 t/week x 1.3 / 7 (proxy V214 PortWatch 22,602)
  port_khor_fakkan:
    container: 110495             # V071 design 5,000,000 TEU/yr x 8.07 (Q27 value; V072: 3.5 M before the 2026 upgrade)
    crude: 4766                   # V148 PortWatch tanker pool (modelled)
    dry_bulk: 2089                # V150 PortWatch dry bulk + general cargo + ro-ro (modelled)
    liquid_bulk: 4766             # V148
    lng: 4766                     # V148
  port_king_abdullah: 20548       # all cargo; V037 official statistic (GASTAT 7.5 Mt, 2025)
  port_mina_al_ahmadi: 271873     # FALLBACK 1,463,933 t/week x 1.3 / 7 (proxy V186 PortWatch 61,318)
  port_qalhat: 13462              # all cargo; V223 PortWatch (modelled)
  port_ras_laffan: 182618         # all cargo; V196 PortWatch (modelled)
