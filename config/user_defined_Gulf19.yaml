    liquid_bulk: 10670            # V157
    lng: 10670                    # V157
  port_shuwaikh: 133161           # FALLBACK 717,022 t/week x 1.3 / 7 (proxy V181 PortWatch 11,297)
  port_sohar:
    container: 44198              # V070 design 2,000,000 TEU/yr (Hutchison Ports Sohar terminal) x 8.07
    crude: 55926                  # V154 PortWatch tanker pool (modelled)
    dry_bulk: 111261              # V154 PortWatch dry bulk + general cargo + ro-ro (modelled)
    liquid_bulk: 55926            # V154
    lng: 55926                    # V154
  port_umm_qasr: 106775           # all cargo; V188 PortWatch (modelled)
  port_yanbu:
    container: 20274              # V044 official pool 'general cargo, containers, dry bulk' 7.4 Mt (2025)
    crude: 682128                 # V046 design 5.0 mb/d (Yanbu crude loading terminals)
