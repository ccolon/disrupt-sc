# -- Logistics (April values, except the retired keys) --
logistics:
  # Cargo classes. Sector keys take precedence over the sector-type keys of
  # default.yaml (agriculture, mining -> dry_bulk; oil_and_gas -> liquid_bulk;
  # default -> container).
  # - Oil -> crude: its own class, so that cargo_mode_eligibility can keep it
  #   on pipelines and ships, and the Strait shock can cut tankers per cargo.
  # - Gas -> lng: its own class (no engine change; plan section 4). LPG cannot
  #   be separated at 19 sectors.
  # - Refining -> liquid_bulk: sector_table_full.csv types Refining
  #   'manufacturing', which shipped refined products as containers in April
  #   (material.md D8); liquid_bulk is the oil_and_gas class. The data file is
  #   used as it is, so the 'type' column still says manufacturing where it is
  #   read for stocks: firm stocks of refined products 30 days either way here,
  #   household stocks 14 days (manufacturing) instead of the 7-day default.
  sector_to_cargo_type:
    Oil: crude
    Gas: lng
    Refining: liquid_bulk
  speeds:  # km/hour
    roads: 60       # Gulf highways are high quality
    maritime: 25    # average container vessel in Gulf waters
    airways: 800
  basic_cost:  # USD per ton*km
    roads: 0.09
    maritime: 0.003
    airways: 1.5    # air freight premium
    multimodal: 0.01
  border_crossing_fees:  # USD/ton - GCC has relatively low barriers
    roads: 30
    maritime: 20
    airways: 10
  border_crossing_times:  # hours
    roads: 2.0      # GCC borders are relatively smooth
    maritime: 4
    airways: 2
    multimodal: 3
  dwell_times:  # hours
    roads-maritime: 18
    roads-airways: 18
    roads-maritime-fujairah: 18
    roads-maritime-khor_fakkan: 18
    roads-pipelines-fujairah: 18
  loading_fees:  # USD/ton
    roads-maritime: 2.5
    roads-maritime-fujairah: 8
    roads-pipelines-fujairah: 8
    roads-maritime-khor_fakkan: 10
    roads-airways: 5.0
  # -- Calibration levers (Hormuz node A4a, rounds 1-3, 19 Nov 2026; frozen before any
  # shocked run: disrupt-sc-studies/hormuz/calibration/levers_frozen.yaml) --
  # Per-port fees, USD per ton on every cargo crossing the named lane (name-specific is
  # added to the lane's cost label), each just above the switch fee measured on the
  # round-0 routes (hormuz/scripts/a4a_switch_cost.py), against misallocated flows:
  # Kuwait's crude left from the commercial port (Shuwaikh; switch 13.98) instead of Mina
  # al Ahmadi; Oman's crude from Sohar through the 237 km pipeline extension (switch 1.88)
  # instead of Mina al Fahal at the end of the Yibal line; Qatar's crude for India from the
  # container port (Hamad; switch 3.84) instead of Ras Laffan; Duqm above its proxy (163
  # vs 103 kt/week; switch 2.63, its users go to Mina al Fahal); Khalifa above its proxy
  # and 1.44 x its statistic (1.0 moves the groups switching at 0.20; 1.29 would move
  # 634 kt/week at once and leave Khalifa at 0.24 x).
  name-specific:
    port_shuwaikh: 15
    port_sohar: 3
    port_hamad: 5
    port_duqm: 3
    port_khalifa: 1.0
  # Value of time, USD per ton-hour (0.49 everywhere before A4a): dry bulk at sea 0.25, so
  # that Khalifa's dry bulk prefers Jebel Ali's longer sea leg (149 km more sea, 20 km less
  # road; switch below 0.27) - Khalifa from 1.44 to 0.73 x its statistic; at 0.22 and below
  # Saudi coal for Europe leaves Jeddah for Dammam around Arabia (Dammam 1.21 x its
  # capacity, round 2). The window [0.23, 0.27) is narrow: a sensitivity, not a measured
  # value. The EU scope's structure (bulk 0.08, containers 0.15 at sea) was tried (round 1)
  # and sends Saudi west-coast trade around Arabia (Jeddah 0.15 x, Dammam 1.8 x).
  cost_of_time:
    dry_bulk: {default: 0.49, maritime: 0.25}
    default: 0.49
