# Logging level
logging_level: "info"

filepaths:
  "transport": "Transport/transport.gpkg"
  "multimodal": "Transport/multimodal.gpkg"
  # Economic data
  "sector_table": "Economic/sector_table.csv"
  "mrio": "Economic/mrio.csv"
  "usd_per_ton": "Economic/usd_per_ton.csv"
  # Spatial data
  "households_spatial": "Spatial/households.geojson"
  "countries_spatial": "Spatial/countries.geojson"
  "firms_spatial": "Spatial/firms.geojson"
  # Optional
  "inventory_duration_targets": "Economic/inventory_targets.csv"
  "admin": "Spatial/admin.geojson"

admin: None

with_transport: True

# duration of simulation
t_final: 10  # in time_resolution unit

# Whether to export files
export_files: False


# Logistic parameters
logistics:
  sector_to_cargo_type:  # cargo type for each sector type
    agriculture: "dry_bulk"
    mining: "dry_bulk"
    oil_and_gas: "liquid_bulk"
    default: "container"
  speeds:  # km/hour
    roads: 50
    maritime: 35
    airways: 800
    railways: 50
    waterways: 7
    pipelines: 50
  basic_cost:  # per ton*km
    roads: 0.01
    maritime: 0.001
    airways: 1
    railways: 0.005
    waterways: 0.005
    pipelines: 0.0001
    multimodal: 0.01
  chunk_size: 1000000000  # tons/day; shipment chunk granularity for route splitting (very large = no splitting)
  switching_costs:
    modal_switch: 0.15  # Additional cost percentage when switching transport modes (e.g., rail to road)
    port_switch: 0.05
  dwell_times:  # hours
    roads-maritime: 12
    roads-railways: 12
    roads-maritime-dom: 12
    roads-airways: 12
    roads-waterways: 12
    railways-maritime: 12
    railways-waterways: 12
    waterways-maritime: 12
    roads-pipelines: 12
    railways-pipelines: 12
    pipelines-maritime: 12
  loading_fees: #USD/ton
    roads-maritime: 2.2
    roads-maritime-dom: 2.2
    roads-airways: 2.2
    roads-waterways: 2.2
    roads-railways: 2.2
    railways-maritime: 2.2
    railways-waterways: 2.2
    waterways-maritime: 2.2
    roads-pipelines: 2.2
    railways-pipelines: 2.2
    pipelines-maritime: 2.2
  border_crossing_fees: #USD/ton
    roads: 30
    maritime: 30
    railways: 30
    waterways: 30
    airways: 30
    pipelines: 5
  border_crossing_times: #hours
    roads: 1.5
    maritime: 2
    multimodal: 2
    railways: 2
    waterways: 2
    airways: 2
    pipelines: 0
  cost_of_time: 0.49 #USD/hour
  variability_coef: 0.44 #USD/hour
  variability: #as fraction of travel time
    roads:
      paved: 0.01
      unpaved: 0.075
    maritime: 0.005
    airways: 0.005
    waterways: 0.02
    railways: 0.02
    multimodal:
      roads-maritime: 0.1
      roads-airways: 0.1
      roads-waterways: 0.1
      roads-railways: 0.1
      railways-maritime: 0.1
      pipelines-maritime: 0.1
  name-specific:
    azerty: 0

# Dictionary of edges, identified by their name, for which we have data on their flow, in monetary terms
flow_data: {}

# Default capacity per transport mode (tons/day).
# A number sets shared capacity for all cargo types.
# A dict sets per-cargo-type capacity (0 = blocked).
# Modes not listed default to unlimited.
default_transport_capacity:
  roads: 100000        # ~5,000 trucks/day x 20t — shared across cargo types
  railways: 200000     # shared
  maritime: 5000000    # sea lanes effectively unconstrained
  airways:
    container: 5000    # air freight is containerized
    dry_bulk: 0        # no bulk by air
    liquid_bulk: 0     # no liquid by air
  multimodal: 500000   # generous for generic connectors
  pipelines:
    container: 0
    dry_bulk: 0
    liquid_bulk: 500000

# Transport capacity overrides: edge_name -> capacity in tons per day
# A number sets shared capacity; a dict sets per-cargo-type capacity
transport_capacity_overrides: {}
  # Example entries:
  # strait_of_hormuz: 3000000     # shared, tons/day
  # port_jebel_ali:
  #   container: 450000
  #   dry_bulk: 80000
  #   liquid_bulk: 200000

# Whether to cache route in a dictionary
use_route_cache: True

# List of transport modes to include
transport_modes: ['roads', "maritime"]

# Monetary units to use in model. 'USD', 'kUSD', 'mUSD'
monetary_units_in_model: "mUSD"

# Monetary units in input files. 'USD', 'kUSD', 'mUSD'
monetary_units_in_data: "mUSD"

# Define the type of input data to calibrate the model.
# Current v2 runtime supports 'mrio'. Transaction-based firm creation is not implemented.
firm_data_type: "mrio"


# Whether to model congestion
congestion: True

# Whether firms should readjust their price to changes in input prices
propagate_input_price_change: True

# Which sectors to include. Possible values:
# - 'all': all the sectors are kept
# - list of sectors
sectors_to_include: "all"

# Which sectors to specifically exclude.
# - None
# - list of sectors
sectors_to_exclude: None

# The products from those sectors do not need transport network to be transported
sectors_no_transport_network: ['utility', 'transport', 'trade', 'services', 'service', 'construction']

# Country agents listed here have their inbound and outbound flows treated as
# "virtual" — no route is computed, no transport-network capacity is consumed,
# and shipments bypass the network entirely (same mechanism as sectors_no_transport_network,
# but keyed on the country pid). Use this for trade partners whose link to the
# studied region is out of scope (e.g. extra-regional imports/exports that don't
# touch the modelled transport infrastructure). Leave empty to keep all
# countries on the transport network.
countries_no_transport: []

# When True (default), each shipment is tagged with a cargo type (container,
# dry_bulk, liquid_bulk, …) derived from sector_to_cargo_type, and the routing
# pipeline runs once per cargo type. When False, every shipment uses a single
# "any" cargo type and Dijkstra/LP runs once instead of N times.
# Set this to False for studies that have no pipelines or other per-cargo-type
# infrastructure — it can roughly N× speed up the routing build, with no loss
# of fidelity in that case.
use_cargo_types: True

# Whether the B2C flows are transported on the transport network
transport_to_households: True

# Single quantile-style knob controlling agent and link filtering.
# For each MRIO buyer column AND each MRIO supplier row, cells are sorted
# by absolute value (descending) and kept until their cumulative share
# of the buyer's (resp. supplier's) total reaches `flow_coverage`. The
# union of the two kept-cell sets defines which region_sectors, external
# countries, and bilateral trade flows are modeled. Each kept agent
# therefore retains ≥flow_coverage of both its in-flows and its
# out-flows. Replaces the legacy cutoff_sector_output / cutoff_sector_demand
# / combine_sector_cutoff / cutoff_firm_output / cutoff_household_demand /
# input_coverage knobs.
# Range: (0, 1]. Typical values: 0.7 (sparser, faster) – 0.99 (denser, slower).
flow_coverage: 0.95

# Which countries to include. Possible values:
# - 'all': all the districts are kept
# - list of countries
countries_to_include: "all"


# If True, the service firms (utility, transport, service) are modeled as the nonservice firms
# Their output will not use the transport network, but their inputs, if it comes from nonservice firms, will.
# If False, then two firms per service sector will be modeled for the whole country
# Neither their input nor output will use the transport network.
explicit_service_firm: True

# Duration target for the firm inventory
# When firm holds the inventories meeting this target, then the firms can keep meeting their pre-disruption
# production targets without ordering more inputs for the specified number of time steps.
# if definition = per_input_type, then give values of sector type
# if definition = inputed, then give a filepath
inventory_duration_targets:
  definition: per_input_type  # inputed
  values:
    default: 30
    utility: 3
    agriculture: 15
    manufacturing: 30
    service: 90
    services: 90
    trade: 30
    transport: 5
  unit: day

# Number of DAYS over which firms close the gap to their inventory target each
# step (extra order = inventory_gap / restoration_time_in_steps; converted from
# days to time steps internally via time_resolution). A SMALLER value = more
# aggressive restocking. See Henriet, Hallegatte, and Tabourier 2011.
inventory_restoration_time: 30

# Whether households should use inventory buffers.
# When enabled, households reuse the same `inventory_duration_targets`
# and `inventory_restoration_time` parameters as firms.
enable_household_inventories: False

# In case firms have more than one supplier for an input, determines whether to adapt the order to each supplier
# based on how well they covered the previous order
adaptive_supplier_weight: False

# Determines the initial utilization rate of firms
# It is used to determine, based on the production of the input-output equilibrium, the production capacity of the firms
# E.g., if a firm produces 80 and has a 0.8 utilization rate, then its production capacity is set to 100.
# It applies uniformly to all firms.
# Capital is split active:idle = utilization_rate:(1-utilization_rate). Firms rest
# at eq output (active capital) and can mobilize idle capital up to production
# capacity to meet surge demand (see time_to_activate_idle_capital).
utilization_rate: 0.8

# Characteristic time (DAYS) for a firm to bring idle capital online (or mothball
# active capital) when its production target exceeds/falls short of current
# capacity. Per step at most min(1, days_per_step/tau) of the source stock moves,
# so full mobilization takes ~tau. Smaller = faster capacity response.
time_to_activate_idle_capital: 30

# Determines the way firms ration their clients if they cannot meet all demand
# Possible values are:
# - 'equal': all clients are equally rationned in proportion of their order
# - 'household_first': if the firm sells to both households and other firms, then households are served first
rationing_mode: "equal"

# Set the number of supplier that firms have for each type of input
# Possible values are:
# - 1: each firms select one supplier per input
# - 2: each firms select two suppliers per input
# - a decimal number between 1 and 2: firms choose either one or two suppliers per input, such that, in average
# the average number of supplier per sector is equal to the specified number.
nb_suppliers_per_input: 1

# Determines how important it is for firms to choose suppliers close to them
# The chance of choosing a firm as a supplier for an input, depends on its importance score and on its distance
# It is (importance) / (distance)^w where w is the weight_localization parameter
weight_localization_firm: 1

# Determines how important it is for households to choose suppliers close to them
# The chance of choosing a firm as a supplier for an input, depends on its distance
# It is 1 / (distance)^w where w is the weight_localization parameter
weight_localization_household: 4


# The type of simulation to run
simulation_type: initial_state

# Nb of Monte Carlo simulations to run
mc_repetitions: 0

# Monte Carlo caching configuration - specifies which model components to reuse between iterations
mc_caching:
  transport_network: true  # Reuse transport network (expensive to rebuild)
  agents: true            # Reuse agents (firms, households, countries)
  sc_network: false       # Regenerate supply chain network (allows stochastic variation)
  logistic_routes: false  # Regenerate logistic routes (allows stochastic variation)

# Reserved for future sensitivity analysis support.
sensitivity: null

# Determines the disruptive events to model TODO elaborate
disruptions: null

# What time interval does a time step represents
# Possible values are: 'day', 'week', 'month', 'year'
time_resolution: 'week'

# Seed for Python's `random` and numpy.random. Applied just before the
# supply-chain build (the only RNG-driven stage). Leave null for legacy
# non-reproducible behavior; set an integer to get a deterministic agent
# set + supply chain across runs (essential for resuming a partial
# criticality sweep).
seed: null

# Defines the criticality loop
criticality:
    # New scenario-list mode:
    # Each inner list is one run, using edge names and a full shutdown
    # Example:
    # scenarios:
    #   - ["port_fujairah"]
    #   - ["Strait of Hormuz", "port_fujairah"]
    # Outputs are written directly to:
    #   output/<scope>/criticality_results.csv
    #   output/<scope>/criticality_results.geojson
    scenarios: []

    # Legacy flat edge loop mode (used when scenarios is empty)
    # Select edges via an attribute/value filter, then shut each one separately
    edges: []
    attribute: null
    duration: 1

    # Skip edges carrying zero tons in the baseline (no point testing them).
    # Applied after the attribute filter and before top_n.
    skip_zero_flow: true

    # Restrict the legacy loop to the top-N edges by baseline tons flow
    # (descending). Null = test every surviving edge.
    top_n: null

    # Subfolder name under output/<scope>/criticality/. When null, the
    # name defaults to the first 8 hex chars of the fingerprint hash, so
    # different parameter sets (e.g. duration=4 vs duration=8) automatically
    # land in distinct folders and resume independently. Set to a string
    # to name a run explicitly, e.g. "baseline" or "duration8_seed42".
    run_id: null


# Value of the household extra spending and consumption loss under which we stop the simulation
# Units is the monetary_units_in_model
epsilon_stop_condition: 1e-3

# Characteristic of the transport edges that the path chosen by firms to
# deliver to their to clients should minimized
# Possible values are:
# - time_cost
# - cost_per_ton
route_optimization_weight: "cost_per_ton"

# If the relative increase in transport cost is larger than this value, then the firm chooses not to deliver
# the product
price_increase_threshold: 2

# If False, firms try to restore their initial (=equilibrium) inventories
# If True, they reassess their inventory targets based on current orders
adaptive_inventories: False

# Transport capacity constraint behavior
# Options:
#   "off" or false: No capacity constraints (unlimited capacity)
#   "gradual": Gradual cost scaling based on utilization (1x → 10x cost multiplier)  
#   "binary": Traditional on/off penalty when capacity exceeded (1e10x cost penalty)
capacity_constraint: "off"

# Maximum iterations for capacity-aware route pre-computation
# Each iteration re-routes flows from congested edges. 3-5 is usually sufficient.
capacity_routing_max_iterations: 3


# Share of transport cost in country import/export prices (for rerouting cost passthrough)
country_transport_share: 0.2
firm_transport_share: 0.2

# Define how much built capital firms have given their level of output
capital_to_value_added_ratio: 3
