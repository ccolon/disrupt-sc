name: dsc
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Core data processing
  - pandas>=2.0
  - numpy>=1.24
  - pyarrow>=10.0          # Parquet I/O (MRIO tables)
  - openpyxl>=3.0          # Excel (.xlsx) I/O
  # Geospatial processing
  - geopandas>=1.0
  - shapely>=2.0
  - pyogrio>=0.7           # Fast GeoJSON read/write backend for geopandas
  # Network analysis
  - networkx>=3.0
  # Scientific computing
  - scipy>=1.10
  # Configuration and utilities
  - pyyaml>=6.0
  - tqdm>=4.60
  # Reporting (interactive HTML figures)
  - plotly>=5.0
  # Testing
  - pytest>=6.0
